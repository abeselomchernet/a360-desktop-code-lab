name: Synthetic Python Tests
on:
  push:
    branches: ["main", "r02/public-safe-foundation"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated synthetic tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
